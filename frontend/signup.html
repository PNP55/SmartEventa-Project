<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — SmartEventa</title>
  <meta name="description" content="Sign up for a free SmartEventa account." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="index.css" />
  <link rel="stylesheet" href="auth.css" />
  <link rel="icon" type="image/png" href="assets/smarteventa-logo.png" />
</head>
<body class="auth-body">

  <div class="auth-container">
    <div class="auth-card">
      <a href="index.html" class="auth-logo">
        <img src="assets/smarteventa-logo.png" alt="SmartEventa" class="smart-eventa-logo" />
        <span class="logo-text">SmartEventa</span>
      </a>

      <div class="auth-header">
        <h1 class="auth-title">Create account</h1>
        <p class="auth-subtitle">Join SmartEventa free today.</p>
      </div>

      <div class="auth-alert" id="auth-alert" style="display:none;"></div>

      <form class="auth-form" id="signup-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input
            type="text"
            id="name"
            class="form-input"
            placeholder="Your full name"
            autocomplete="name"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input
            type="email"
            id="email"
            class="form-input"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              class="form-input"
              placeholder="Min. 6 characters"
              autocomplete="new-password"
              required
              minlength="6"
            />
            <button type="button" class="password-toggle" id="password-toggle" aria-label="Toggle password">👁</button>
          </div>
        </div>

        <button type="submit" class="btn-primary btn-full" id="signup-btn">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        <p>Already have an account? <a href="login.html" class="auth-link">Sign in</a></p>
        <p><a href="events.html" style="color: var(--text-muted); font-size: 0.8rem;">Browse events without an account →</a></p>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="config.js"></script>
  <script src="signup.js"></script>
</body>
</html>
